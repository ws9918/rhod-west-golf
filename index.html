<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#11201a" />
<title>Rhod + West Golf Adventures</title>
<link rel="apple-touch-icon" href="img/crest-180.png" />
<link rel="icon" sizes="64x64" href="img/crest-64.png" />
<link rel="icon" sizes="32x32" href="img/crest-32.png" />
<link rel="stylesheet" href="vendor/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f3f1ea; --card:#ffffff; --ink:#16201a; --muted:#7a8279; --faint:#aeb4aa;
    --line:#e8e7df; --green:#15643f; --green-2:#1c8b56; --green-d:#0d4a2d; --gold:#b8902f; --gold-soft:#d9b25a;
    --navy:#243b4f;
    /* the app is about two people, so each one is a colour in the system */
    --west:#15643f; --west-2:#1c8b56; --west-soft:#e9f3ed;
    --rhod:#243b4f; --rhod-2:#3a5f7d; --rhod-soft:#e9eef4;
    --gap:#b9702c; --gap-soft:#fbf1e2;
    --bad:#c75f43; --mid:#cf9a35; --good:#3f9a64; --great:#15643f;
    --shadow:0 1px 2px rgba(20,35,25,.04); --shadow-lg:0 16px 44px rgba(20,35,25,.16);
    --hair:#f0f1ec;
    --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
  #app{max-width:560px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--bg)}
  main{flex:1;overflow:hidden;position:relative}
  .view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;padding-bottom:96px}
  .view.active{display:block}
  #view-map{padding-bottom:0;overflow:hidden}
  #map{position:absolute;inset:0}
  .serif{font-family:"Fraunces",Georgia,"Times New Roman",serif}
  h1,h2,h3{font-family:"Fraunces",Georgia,serif;letter-spacing:-.3px;font-weight:600}
  /* ---------- FEED ---------- */
  .hero{position:relative;height:230px;overflow:hidden}
  .hero img{width:100%;height:100%;object-fit:cover;display:block;background:#11201a}
  .hero .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,18,12,.25) 0%,rgba(8,18,12,0) 35%,rgba(8,18,12,.72) 100%)}
  .hero .crest{position:absolute;top:calc(14px + var(--sat));left:50%;transform:translateX(-50%);width:52px;height:52px;border-radius:50%;filter:drop-shadow(0 3px 10px rgba(0,0,0,.45))}
  .hero .ttl{position:absolute;left:20px;right:20px;bottom:18px;color:#fff;text-align:center}
  .hero .ttl .kick{font-size:10.5px;letter-spacing:3px;text-transform:uppercase;opacity:.85;font-weight:700}
  .hero .ttl h1{font-size:30px;margin:4px 0 0;font-weight:600;text-shadow:0 2px 16px rgba(0,0,0,.45)}
  .hero .ttl p{margin:5px 0 0;font-size:12.5px;opacity:.9;letter-spacing:.2px}
  .statbar{display:flex;gap:10px;padding:14px}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center}
  .stat b{display:block;font-size:24px;line-height:1;font-family:"Fraunces",serif;font-weight:600}
  .stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:6px;display:block;font-weight:700}
  .section-h{font-size:11.5px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);font-weight:800;margin:20px 18px 10px;display:flex;justify-content:space-between;align-items:center}
  .section-h a{color:var(--green);text-decoration:none;font-weight:700;letter-spacing:.2px;text-transform:none;font-size:13px}
  .filters{display:flex;gap:8px;overflow-x:auto;padding:2px 14px 2px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);padding:8px 15px;border-radius:99px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip .dot{width:9px;height:9px;border-radius:50%}
  /* memory card */
  .mcard{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:0 14px 14px;overflow:hidden;box-shadow:var(--shadow)}
  .mcard.t100{border-color:#ecd9a6;box-shadow:0 6px 22px rgba(184,144,47,.14)}
  .mcard .ph{position:relative;width:100%;aspect-ratio:16/10;background:#e7e6de;overflow:hidden}
  .mcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .mcard .ph .pgrad{position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(8,18,12,.55))}
  .mcard .ph .cnt{position:absolute;right:11px;top:11px;background:rgba(8,18,12,.6);color:#fff;font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;backdrop-filter:blur(4px)}
  .mcard .ph .av-over{position:absolute;left:12px;bottom:12px}
  .mcard .body{padding:15px}
  .mcard .top{display:flex;align-items:center;gap:12px}
  .mcard .badge{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;flex:0 0 auto;font-family:"Fraunces",serif}
  .mcard .nm{font-family:"Fraunces",serif;font-weight:600;font-size:18px;line-height:1.12;display:flex;align-items:center;gap:7px}
  .mcard .nm .star{color:var(--gold);font-size:13px}
  .mcard .dt{color:var(--muted);font-size:12px;margin-top:3px;letter-spacing:.2px}
  .tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
  .tag{font-size:12px;font-weight:700;padding:6px 11px;border-radius:10px;background:#f3f4f0;color:#46504a;display:flex;align-items:center}
  .tag em{font-style:normal;color:var(--faint);font-weight:800;text-transform:uppercase;letter-spacing:.6px;font-size:9.5px;margin-right:6px}
  .tag.win{background:#eef6f0;color:var(--green-d)}
  .tag.win em{color:var(--green-2)}
  .tag.bet{background:#fbf3e0;color:#8a6a18}
  .tag.bet em{color:var(--gold)}
  .mcard .note{font-size:13.5px;color:#4b554d;margin-top:13px;line-height:1.5}
  /* avatars */
  .avgrp{display:flex;align-items:center}
  .avgrp .av:not(:first-child){margin-left:-9px}
  .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;border:2px solid var(--card);box-shadow:0 1px 3px rgba(0,0,0,.18);font-family:"Inter",sans-serif}
  .av.lg{width:30px;height:30px;font-size:12px}
  .av.w{background:linear-gradient(150deg,var(--green-2),var(--green))}
  .av.r{background:linear-gradient(150deg,#34526b,var(--navy))}
  .av.g{background:linear-gradient(150deg,var(--gold-soft),var(--gold))}
  .av-over .av{border-color:rgba(255,255,255,.92)}
  /* list rows */
  .search{margin:12px 14px 4px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 14px}
  .search input{border:0;outline:0;background:transparent;font-size:15px;width:100%;color:var(--ink);font-family:inherit}
  .list{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:0 14px 20px;overflow:hidden}
  .row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);margin:0 14px 10px;border-radius:16px;padding:11px;box-shadow:var(--shadow)}
  .list .row{border:0;border-radius:0;margin:0;box-shadow:none;padding:14px 15px}
  .list .row+.row{border-top:1px solid var(--hair)}
  .rank-no{width:20px;text-align:center;font-weight:600;color:#c3c8be;font-size:13px;flex:0 0 auto;font-family:"Fraunces",serif}
  .badge-sm{flex:0 0 auto;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;font-family:"Fraunces",serif}
  .badge-sm.un{background:#edece5;color:#9aa295;font-size:20px;font-family:"Inter"}
  .row .meta{flex:1;min-width:0}
  .row .nm{font-family:"Fraunces",serif;font-weight:600;font-size:16px;line-height:1.18;display:flex;align-items:center;gap:6px}
  .row .nm .star{color:var(--gold);font-size:12px}
  .row .sb{color:var(--muted);font-size:12.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thumb{width:46px;height:46px;border-radius:13px;object-fit:cover;flex:0 0 auto}
  .thumb.terr{filter:saturate(.82)}           /* stand-in, not a photo from the round */
  .thumb.terr.un{opacity:.6;filter:saturate(.55)}   /* and quieter still before it's rated */
  .chev{color:#d2d6cd;font-size:20px;flex:0 0 auto}
  .row .rt{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  /* top100 */
  .cover{margin:14px;border-radius:20px;padding:20px;color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden;background:#0d4a2d}
  .cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.32}
  .cover .cc{position:relative}
  .cover .big{font-size:46px;font-weight:600;line-height:1;font-family:"Fraunces",serif}
  .cover .lbl{opacity:.94;font-size:13px;margin-top:5px}
  .cover .bar{height:7px;background:rgba(255,255,255,.25);border-radius:99px;margin-top:14px;overflow:hidden}
  .cover .bar i{display:block;height:100%;background:var(--gold-soft)}
  /* map */
  .map-chip{position:absolute;left:12px;top:calc(12px + var(--sat));z-index:500;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;box-shadow:var(--shadow);font-size:12px}
  .map-chip b{font-size:15px;font-family:"Fraunces",serif}
  .legend{position:absolute;right:12px;bottom:18px;z-index:500;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;box-shadow:var(--shadow);font-size:11px;line-height:1.7}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
  /* nav */
  nav{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 4px calc(8px + var(--sab));z-index:600}
  nav button{flex:1;border:0;background:transparent;color:var(--faint);font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;letter-spacing:.3px}
  nav button svg{width:23px;height:23px}
  nav button.on{color:var(--green)}
  nav .add{flex:0 0 auto}
  nav .add .plus{width:54px;height:54px;border-radius:50%;background:linear-gradient(150deg,var(--green-2),var(--green));color:#fff;display:grid;place-items:center;font-size:28px;box-shadow:0 8px 20px rgba(21,100,63,.42);margin-bottom:3px}
  /* sheet */
  .scrim{position:fixed;inset:0;background:rgba(12,22,15,.55);z-index:900;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:26px 26px 0 0;z-index:901;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:94dvh;overflow-y:auto;padding:8px 18px calc(28px + var(--sab));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
  .sheet.show{transform:translateY(0)}
  .grab{width:48px;height:5px;box-sizing:content-box;padding:13px 22px;margin:0 auto 2px;border-radius:99px;background:#dcded7;background-clip:content-box;cursor:grab;touch-action:none}
  .grab:active{cursor:grabbing}
  .sheet h2{font-size:25px;margin:6px 0 2px;font-weight:600}
  .loc{color:var(--muted);font-size:13px;margin-bottom:14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .pill{font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;background:#f1f2ee;color:#5a645c;letter-spacing:.3px}
  .pill.gold{background:#f7eed4;color:#8a6a18}
  .pill.green{background:#e4f1ea;color:var(--green-d)}
  .scorehead{display:flex;align-items:center;gap:15px;margin:10px 0 16px}
  .scorehead .big{width:70px;height:70px;border-radius:18px;display:grid;place-items:center;color:#fff;font-weight:600;font-size:28px;flex:0 0 auto;font-family:"Fraunces",serif}
  .scorehead .sub{font-size:12.5px;color:var(--muted)}
  .scorehead .sub b{color:var(--ink)}
  .course-banner{position:relative;width:100%;height:130px;border-radius:16px;overflow:hidden;margin:2px 0 14px;background:#e7e6de}
  .course-banner img{width:100%;height:100%;object-fit:cover;display:block}
  .course-banner .cb-ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,18,12,0) 40%,rgba(8,18,12,.6))}
  .course-banner .cb-cap{position:absolute;left:12px;bottom:10px;color:#fff;font-size:11.5px;font-weight:600;opacity:.92}
  .gallery{display:flex;gap:9px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
  .gallery::-webkit-scrollbar{display:none}
  .gallery img{height:104px;width:104px;border-radius:14px;object-fit:cover;flex:0 0 auto}
  .gallery .add{height:104px;width:104px;border-radius:14px;border:1.5px dashed #d3d6ce;display:grid;place-items:center;color:var(--muted);font-size:26px;flex:0 0 auto;background:var(--bg)}
  /* ×2 marks the one factor that carries double weight in the rating */
  .wx{display:inline-block;margin-left:5px;padding:1px 4px;border-radius:5px;background:#e7ede8;color:var(--green);
      font-size:9.5px;font-weight:800;letter-spacing:.3px;vertical-align:1px;font-family:system-ui,sans-serif}
  .h2h-row .lbl .wx{background:#dfe6e0}
  .rbar .rn .wx{background:rgba(255,255,255,.2);color:#cfeedd}
  .running{display:flex;align-items:center;gap:11px;margin:14px 0 2px;padding:11px 13px;border:1px solid var(--line);border-radius:14px;background:#fbfcfa}
  .running .rs{width:48px;height:48px;border-radius:14px;flex:0 0 auto;display:grid;place-items:center;color:#fff;
               font-family:"Fraunces",serif;font-weight:600;font-size:20px}
  .running .rl{font-size:12.5px;color:var(--muted);line-height:1.45}
  .running .rl b{color:var(--ink)}
  .fb{display:flex;align-items:center;gap:10px;margin:8px 0}
  .fb .fn{width:122px;font-size:13px;color:var(--muted)}
  .fb .ft{flex:1;height:7px;background:#edefe9;border-radius:99px;overflow:hidden}
  .fb .ft i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--green-2))}
  .fb .fv{width:44px;text-align:right;font-weight:800;font-size:13px;font-family:"Fraunces",serif;white-space:nowrap}
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:16px;font-weight:800;margin-top:12px;font-family:inherit}
  .btn.primary{background:linear-gradient(150deg,var(--green-2),var(--green));color:#fff}
  .btn.ghost{background:#eef0ea;color:var(--ink)}
  .btn.dark{background:var(--ink);color:#fff}
  .field{margin-top:18px}
  .field>label{font-weight:800;font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);display:block;margin-bottom:9px}
  /* who-played big toggles */
  .who{display:flex;gap:10px}
  .who button{flex:1;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:13px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;font-weight:700;font-size:13px;color:var(--ink)}
  .who button .av{width:34px;height:34px;font-size:14px;border-color:transparent}
  .who button.on{border-color:var(--green);background:#eef6f0}
  .slabel{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 3px}
  .slabel .t{font-weight:700;font-size:15px}
  .slabel .d{font-size:11.5px;color:var(--muted);max-width:60%;text-align:right;text-wrap:balance}
  .slabel .v{font-weight:800;color:var(--green);font-size:16px;margin-left:8px;font-family:"Fraunces",serif;white-space:nowrap}
  input[type=range]{-webkit-appearance:none;width:100%;height:30px;background:transparent}
  input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--green) var(--p,70%),#e7e9e3 var(--p,70%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--green);margin-top:-9px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  textarea,input.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:15px;font-family:inherit;background:var(--bg);color:var(--ink)}
  textarea{resize:vertical;min-height:66px}
  .seg{display:flex;flex-wrap:wrap;gap:8px}
  .seg button{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px 15px;border-radius:11px;font-size:14px;font-weight:700}
  .seg button.on{background:var(--green);color:#fff;border-color:var(--green)}
  .twocol{display:flex;gap:10px}.twocol>div{flex:1}
  .row-pick{max-height:54dvh;overflow-y:auto;margin-top:6px}
  /* recap */
  #recapWrap{padding:6px 2px 0}
  .recap{border-radius:22px;overflow:hidden;background:#0c241a;color:#fff;position:relative}
  .recap .rphoto{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#143226}
  .recap .rph-empty{aspect-ratio:auto;height:150px}
  .recap .rgrad{position:absolute;left:0;right:0;top:0;height:60%;background:linear-gradient(180deg,rgba(0,0,0,.5),transparent)}
  .recap .rkick{position:absolute;top:16px;left:18px;font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;opacity:.92}
  .recap .rscore{position:absolute;top:14px;right:16px;width:58px;height:58px;border-radius:15px;display:grid;place-items:center;font-weight:600;font-size:23px;color:#0c241a;font-family:"Fraunces",serif}
  .recap .ravs{position:absolute;left:18px;bottom:14px}
  .recap .rbody{padding:16px 18px 52px}
  .recap h3{margin:0;font-size:27px;letter-spacing:-.4px;font-weight:600}
  .recap .rsub{opacity:.78;font-size:13px;margin-top:4px}
  .recap .rbars{margin:15px 0 4px}
  .rbar{display:flex;align-items:center;gap:9px;margin:7px 0}
  .rbar .rn{width:128px;font-size:11px;opacity:.85;text-transform:uppercase;letter-spacing:.4px}
  .rbar .rt{flex:1;height:6px;background:rgba(255,255,255,.16);border-radius:99px;overflow:hidden}
  .rbar .rt i{display:block;height:100%;background:linear-gradient(90deg,#7fd6a3,#b9e8cd)}
  .rbar .rv{width:40px;text-align:right;font-weight:700;font-size:12px;font-family:"Fraunces",serif;white-space:nowrap}
  .recap .rtags{display:flex;flex-wrap:wrap;gap:7px;margin-top:15px}
  .recap .rtag{font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:10px;background:rgba(255,255,255,.1)}
  .recap .rtag em{font-style:normal;opacity:.6;text-transform:uppercase;letter-spacing:.6px;font-size:9.5px;margin-right:5px}
  .recap .rtag.win{background:rgba(127,214,163,.2);color:#c4f0d6}
  .empty{text-align:center;color:var(--muted);padding:10px 26px 30px;font-size:14px;line-height:1.5}
  .empty .emimg{width:100%;height:150px;object-fit:cover;border-radius:18px;margin-bottom:16px}
  .empty .em{font-size:30px;margin-bottom:8px}
  .wipe-wrap{text-align:center;padding:14px 0 22px}
  .rank-note{font-size:12.5px;color:var(--muted);margin:2px 18px 12px;line-height:1.45}
  .row .pill.money{white-space:nowrap;font-family:"Fraunces",serif;font-size:13px;padding:5px 10px}
  .wipe-link{background:transparent;border:0;color:var(--bad);font-size:12.5px;font-weight:700;text-decoration:underline;opacity:.75;font-family:inherit}
  .toast{position:fixed;left:50%;bottom:calc(180px + var(--sab));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 19px;border-radius:12px;font-size:13.5px;z-index:980;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .leaflet-div-icon{background:transparent;border:0}

<body>
<div id="app">
  <main>
    <!-- FEED -->
    <section class="view active" id="view-feed">
      <div class="hero">
        <img src="img/hero-mountain.jpg" alt="" id="heroImg" />
        <div class="ov"></div>
        <img src="img/crest.png" alt="Rhod &amp; West" class="crest" id="crestImg" onerror="this.style.display='none'" />
        <div class="ttl">
          <div class="kick">Established on the first tee</div>
          <h1>Rhod &amp; West</h1>
          <p>A shared logbook of the great courses</p>
        </div>
      </div>

<script>
(function(){
  "use strict";
  /* The Rhod + West rating system.
     Six categories plus Totality. The course rating is a weighted roll-up of all
     seven — `w` is the weight, and Totality carries double. */
  var CATS=[
    {k:"design",t:"Overall Design",d:"Routing, boldness, the design as a whole — not how dramatic it is",max:10,step:0.5,def:7,w:1},
    {k:"holes",t:"Memorable Holes",d:"Self-explanatory — how many of the 18",max:18,step:1,def:0,count:true,w:1},
    {k:"cond",t:"Condition",d:"1 = Thunderbird (Arizona) · 10 = Augusta",max:10,min:1,step:0.5,def:7,w:1},
    {k:"enjoy",t:"Enjoyment",d:"Played alone, would you have enjoyed it? Ignore your score and the company",max:10,step:0.5,def:7,w:1},
    {k:"exp",t:"Experience",d:"Everything that doesn't touch a club — clubhouse, turn house, comfort stations, how they treat you",max:10,step:0.5,def:7,w:1},
    {k:"diff",t:"Difficulty",d:"Self-explanatory",max:10,step:0.5,def:7,w:1}
  ];
  var TOT={k:"tot",t:"Totality",d:"The whole thing, gut call — if it adds up to a 10, it's a 10. Counts double in the rating",max:10,step:0.5,def:7,w:2};
  var SCORED=CATS.concat([TOT]);                               // everything the rating is built from
  var TOTAL_W=SCORED.reduce(function(a,f){return a+f.w;},0);   // 8 when a rating is complete
  var RECOS=[
    {k:"fly",t:"✈️ I'd fly there for it",e:"✈️",sh:"Fly",s:"Worth a trip on its own"},
    {k:"drive",t:"🚗 I'd drive out of my way if nearby",e:"🚗",sh:"Drive",s:"Go play it when you're in the area"},
    {k:"skip",t:"➖ Skip it",e:"➖",sh:"Skip",s:"Don't go out of your way"}
  ];
  var RECO_LEGACY={travel:"fly",trip:"drive",nearby:"drive"};
  function recoKey(k){ return k?(RECO_LEGACY[k]||k):null; }
  function recoObj(k){ k=recoKey(k); for(var i=0;i<RECOS.length;i++)if(RECOS[i].k===k)return RECOS[i]; return null; }
  function recoLabel(k){ var r=recoObj(k); return r?r.t:null; }
  function recoShort(k){ var r=recoObj(k); return r?r.t.replace(/^\S+\s/,""):null; }
  // older rounds were scored on a previous factor set; read the nearest equivalent
  function catVal(rd,k){ if(typeof rd[k]==="number")return rd[k];
    if(k==="exp"&&typeof rd.club==="number")return rd.club;
    if(k==="enjoy"&&typeof rd.fun==="number")return rd.fun;
    return null; }
  var LEGACY=["design","scenery","cond","memory","play","fun","club","excl"];
  /* Whose rating is this? Each rating is scored by one person; each phone remembers its owner. */
  var ME=""; try{ME=localStorage.getItem("rwWho")||"";}catch(e){}
  function setMe(n){ ME=n; try{localStorage.setItem("rwWho",n);}catch(e){} }
  function raterOf(rd){ if(rd.by&&PRINCIPALS.indexOf(rd.by)>=0)return rd.by;
    var p=rd.players||[],w=p.indexOf("West")>=0,r=p.indexOf("Rhod")>=0; if(w&&!r)return"West"; if(r&&!w)return"Rhod"; return"Together"; }
  function raterLabel(rd){ var w=raterOf(rd); return w==="Together"?"Rated together":w+"’s rating"; }
  function latestBy(name,who){ var out=null; rounds(name).forEach(function(r){ if(raterOf(r)===who)out=r; }); return out; }
  function courseRaters(name){ var set={}; rounds(name).forEach(function(r){ var w=raterOf(r); if(w!=="Together")set[w]=1; }); return Object.keys(set); }
  // the ratings that count for a course: each person's latest, plus any legacy shared ratings
  function ratingSet(name){ var out=[]; PRINCIPALS.forEach(function(p){ var r=latestBy(name,p); if(r)out.push(r); }); rounds(name).forEach(function(r){ if(raterOf(r)==="Together")out.push(r); }); return out; }
  function roundById(name,id){ var arr=rounds(name); for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i]; return null; }
  var KEY="rwGolf.v2"; // keep prior data
  var PRINCIPALS=["West","Rhod"];
  /* The courses Rhod and West have played. `courses.js` is the fixed list; anything
     they add from the US-wide search lands in S.added and folds in here, so an added
     course is rated, ranked, mapped and photographed like any other. */
  var BASE_COURSES=window.COURSES||[];
  var COURSES=BASE_COURSES.slice(),byName={},playedKeys={};
  function indexCourses(){ var seen={}; COURSES=[];
    BASE_COURSES.concat((S&&S.added)||[]).forEach(function(c){ if(!c||!c.n)return;
      if(seen[c.n])return; seen[c.n]=1; COURSES.push(c); });
    byName={}; playedKeys={}; COURSES.forEach(function(c){ byName[c.n]=c; playedKeys[normKey(c.n)]=c; }); }
  function haveCourse(n){ return !!byName[n]; }
  /* Hiding a US result they already have: the exact name, or the loose key but only
     when the state agrees too — otherwise two unrelated Arrowheads cancel each other. */
  function haveNear(n,state){ if(byName[n])return true;
    var c=playedKeys[normKey(n)]; return !!(c&&c.s===state); }

  /* ---------- shared backend ---------- */
  var CODE=localStorage.getItem("rwCode")||"";
  function hdr(){ var h={"Content-Type":"application/json"}; if(CODE)h["x-rw-code"]=CODE; return h; }
  function promptCode(){
    if(document.getElementById("codeGate"))return;
    var ov=document.createElement("div"); ov.id="codeGate";
    ov.style.cssText="position:fixed;inset:0;z-index:2000;background:#0c241a;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Inter,sans-serif";
    ov.innerHTML='<div style="max-width:340px;width:100%;text-align:center;color:#fff">'
      +'<div style="font-family:Fraunces,Georgia,serif;font-size:27px;font-weight:600;margin-bottom:6px">Rhod &amp; West</div>'
      +'<div style="opacity:.72;font-size:13px;margin-bottom:20px">Enter the shared access code</div>'
      +'<input id="codeInput" type="password" placeholder="Access code" autocomplete="off" style="width:100%;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:16px;text-align:center;margin-bottom:12px;box-sizing:border-box">'
      +'<button id="codeGo" style="width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(150deg,#1c8b56,#15643f);color:#fff;font-weight:800;font-size:16px">Enter</button>'
      +'<div style="color:#e88a73;font-size:12px;margin-top:10px;height:14px">'+(CODE?"That code did not work — try again":"")+'</div></div>';
    document.body.appendChild(ov);
    var inp=ov.querySelector("#codeInput"),go=ov.querySelector("#codeGo");
    function submit(){ var c=inp.value.trim(); if(!c)return; CODE=c; localStorage.setItem("rwCode",c); location.reload(); }
    go.onclick=submit; inp.addEventListener("keydown",function(e){ if(e.key==="Enter")submit(); });
    setTimeout(function(){inp.focus();},100);
  }
  // photos live on the server, keyed by client id
  function putPhoto(id,dataUrl){ return fetch("/api/photo/"+id,{method:"PUT",headers:hdr(),body:JSON.stringify({data:dataUrl})}).catch(function(){}); }
  function delPhoto(id){ return fetch("/api/photo/"+id,{method:"DELETE",headers:hdr()}).catch(function(){}); }
  var photoCache={};
  function loadPhoto(id,imgEl){ if(photoCache[id]){imgEl.src=photoCache[id];return;} imgEl.src="/api/photo/"+encodeURIComponent(id); }
  function downscale(file){ return new Promise(function(res){ var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){ var max=1280,w=img.width,h=img.height;
      if(w>h&&w>max){h=h*max/w;w=max;}else if(h>=w&&h>max){w=w*max/h;h=max;}
      var cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);res(cv.toDataURL("image/jpeg",0.82)); };
    img.onerror=function(){URL.revokeObjectURL(url);res(null);}; img.src=url; }); }

  /* ---------- shared state ---------- */
  var S=defaultState();
  function defaultState(){ return {ratings:{},order:[],t100:{},snub:{},players:["Rhod","West"],trips:[],wishlist:[],dreamDone:{},activeTripId:null}; }
  function normalizeState(r){ r=r||{}; if(!r.ratings)r.ratings={}; if(!r.order)r.order=[]; if(!r.t100)r.t100={}; if(!r.snub)r.snub={};
    if(!r.players||!r.players.length)r.players=["Rhod","West"]; if(!r.trips)r.trips=[]; if(!r.wishlist)r.wishlist=[]; if(!r.dreamDone)r.dreamDone={}; if(!r.added)r.added=[]; return r; }
  function loadState(){ return fetch("/api/state",{headers:hdr()}).then(function(r){ if(r.status===401){promptCode();throw 0;} return r.json(); })
    .then(function(d){ for(var k in S)delete S[k]; var n=normalizeState(d); for(var j in n)S[j]=n[j]; }); }
  var saveT=null,saving=false,saveAgain=false;
  function save(){ clearTimeout(saveT); saveT=setTimeout(function(){saveT=null;pushState();},500); }
  function pushState(){ if(saving){saveAgain=true;return;} saving=true;
    fetch("/api/state",{method:"PUT",headers:hdr(),body:JSON.stringify(S)})
      .then(function(r){ if(r.status===401)promptCode(); }).catch(function(){})
      .then(function(){ saving=false; if(saveAgain){saveAgain=false;pushState();} }); }
  // Re-fetch the shared state before writing a rating, so two phones saving at once don't overwrite each other
  function withFresh(mutate){
    if(saveT||saving){ mutate(); save(); return Promise.resolve(); } // a local change is already in flight — keep it
    return fetch("/api/state",{headers:hdr()}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
      .then(function(d){ if(d){ var n=normalizeState(d); for(var k in S)delete S[k]; for(var j in n)S[j]=n[j]; activeTripId=S.activeTripId||null; }
        mutate(); pushState(); });
  }
  function refreshState(){ if(saveT||saving)return; var sc=document.getElementById("scrim"); if(sc&&sc.classList.contains("show"))return;
    fetch("/api/state",{headers:hdr()}).then(function(r){return r.ok?r.json():null;}).then(function(d){ if(!d)return;
      var n=normalizeState(d); for(var j in n)S[j]=n[j]; activeTripId=S.activeTripId||null;
      syncCourseList(); buildDreamMarkers(); COURSES.forEach(refreshMarker); renderAll(); drawTrip(); updateTripBar(); drawUsLayer(); }).catch(function(){}); }
  function pollUpdates(){ setInterval(refreshState,20000); document.addEventListener("visibilitychange",function(){ if(!document.hidden)refreshState(); }); }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  /* ---------- a photograph for every course ----------
     These are licensed landscape photographs matched to where a course is, NOT pictures
     of the clubs themselves — private clubs' own photography is theirs, and this repo is
     public (see img/CREDITS.md). A course's real pictures, added to a rating, always win.
     Region decides the terrain; a handful of course names override it, because "Bandon"
     tells you more than "Oregon" does. Where a terrain has two frames, the course name
     picks one, so 58 Virginia clubs aren't all showing the same photograph. */
  var TERRAINS={
    mountain:{t:"High country",f:["img/terrain-mountain.jpg"]},
    desert:  {t:"Desert",      f:["img/terrain-desert.jpg"]},
    links:   {t:"Links",       f:["img/terrain-links.jpg","img/terrain-links-2.jpg"]},
    coastal: {t:"Low country", f:["img/terrain-coastal.jpg","img/terrain-coastal-2.jpg"]},
    parkland:{t:"Parkland",    f:["img/terrain-parkland.jpg","img/terrain-parkland-2.jpg"]}
  };
  // the course whose own name settles it, whatever its region says
  var TERRAIN_NAME=[
    ["links",   /bandon|cabot|pebble beach|spanish bay|pasatiempo|chambers bay|whistling straits|erin hills|sand valley|mammoth dunes/i],
    ["mountain",/chamonix/i],
    ["parkland",/silverado|westmorland/i],                              // Napa and New Brunswick, not the coast
    ["desert",  /la quinta|pga west|sand hollow|coral canyon|entrada|^ledges$/i]   // St George red rock, not Park City
  ];
  var TERRAIN_REGION={
    "Arizona":"desert","Nevada":"desert","New Mexico":"desert","Mexico":"desert",
    "Utah":"mountain","Montana":"mountain","Colorado":"mountain","Canada":"mountain",
    "Idaho":"mountain","Wyoming":"mountain","West Virginia":"mountain","Oregon":"mountain",
    "Scotland":"links","Ireland":"links","England":"links","California":"links",
    "Florida":"coastal","Barbados":"coastal","Hawaii":"coastal","South Carolina":"coastal","Louisiana":"coastal"
  };
  var TERRAIN_DEFAULT="parkland";   // Virginia, Maryland, Texas, Georgia, the Carolinas, everywhere else
  function nameHash(str){ var hv=0; for(var i=0;i<str.length;i++)hv=(hv*31+str.charCodeAt(i))|0; return Math.abs(hv); }
  function terrainOf(c){
    for(var i=0;i<TERRAIN_NAME.length;i++) if(TERRAIN_NAME[i][1].test(c.n)) return TERRAIN_NAME[i][0];
    return TERRAIN_REGION[c.s]||TERRAIN_DEFAULT; }
  function courseImage(c){ var t=TERRAINS[terrainOf(c)]; return t.f[nameHash(c.n)%t.f.length]; }
  // 128px squares for list rows — a 1600px banner behind a 46px thumbnail is a phone-data tax
  function courseThumb(c){ return courseImage(c).replace(/\.jpg$/,"-sm.jpg"); }
  function terrainLabel(c){ return TERRAINS[terrainOf(c)].t; }

  /* ---------- every golf course in the US ----------
     OpenStreetMap's leisure=golf_course, pulled a state at a time and bundled into
     us-courses.js as [name, state, lat, lng] rows to keep the file small. Open data
     under the ODbL, no key and no account — the same rule the basemap follows, and
     credited on the map as that licence requires. */
  var US_ROWS=(window.USGOLF&&window.USGOLF.rows)||[];
  var US_STATES=(window.USGOLF&&window.USGOLF.states)||{};
  var US_LC=null;   // built on first search, not at load — it costs nothing until used
  function usCourse(r){ return {n:r[0],s:US_STATES[r[1]]||r[1],st:r[1],lat:r[2],lng:r[3],x:r[4]||null,us:true}; }
  var FAMOUS=null;   // normKey + state of every course Wikipedia writes about
  function famous(r){ if(!FAMOUS){ FAMOUS={};
      ((window.NOTABLE&&window.NOTABLE.rows)||[]).forEach(function(w){ if(w.s)FAMOUS[normKey(w.n)+"|"+w.s]=1; }); }
    return FAMOUS[normKey(r[0])+"|"+r[1]]?1:0; }
  function usSearch(q,cap){ q=(q||"").trim().toLowerCase(); if(q.length<2)return [];
    if(!US_LC)US_LC=US_ROWS.map(function(r){ return (r[0]+" "+(US_STATES[r[1]]||r[1])).toLowerCase(); });
    cap=cap||40; var starts=[],rest=[];
    for(var i=0;i<US_ROWS.length;i++){ var at=US_LC[i].indexOf(q); if(at<0)continue;
      if(haveNear(US_ROWS[i][0],US_STATES[US_ROWS[i][1]]))continue;   // already in their list
      (at===0?starts:rest).push(US_ROWS[i]);
      if(starts.length>=cap*2)break; }
    function rank(a,b){ var d=famous(b)-famous(a); if(d)return d;
      return a[0]<b[0]?-1:a[0]>b[0]?1:0; }
    return starts.sort(rank).concat(rest.sort(rank)).slice(0,cap).map(usCourse); }

  /* Adding a course is a shared change: withFresh re-reads before writing so two
     phones adding at once don't wipe each other. syncCourseList catches additions
     that arrive from the other phone on the 20-second poll. */
  function addUsCourse(u,after){
    if(haveCourse(u.n)){ if(after)after(byName[u.n]); return; }
    var rec={n:u.n,s:u.s,lat:u.lat,lng:u.lng,src:"osm"};
    function done(){ syncCourseList(); renderAll(); if(after)after(byName[u.n]); }
    // withFresh re-reads the shared state before writing, so it settles before we open the course
    Promise.resolve(withFresh(function(){ if(!S.added)S.added=[];
      if(!S.added.some(function(a){return a.n===rec.n;}))S.added.push(rec); })).then(done,done); }
  function syncCourseList(){ var before=COURSES.length; indexCourses();
    if(map)COURSES.forEach(function(c){ if(markers[c.n])return;
      var m=L.circleMarker([c.lat,c.lng],circleStyle(c)); m.on("click",function(){openCourse(c);});
      markers[c.n]=m; playedLayer.addLayer(m); });
    return COURSES.length!==before; }
  function removeAddedCourse(c,after){
    if(!confirm("Remove "+c.n+" from your course list? Any ratings on it go too."))return;
    function done(){ if(markers[c.n]){ playedLayer.removeLayer(markers[c.n]); delete markers[c.n]; }
      indexCourses(); renderAll(); toast("Removed "+c.n); if(after)after(); }
    Promise.resolve(withFresh(function(){ S.added=(S.added||[]).filter(function(a){return a.n!==c.n;});
      delete S.ratings[c.n]; delete S.t100[c.n]; delete S.snub[c.n]; })).then(done,done); }
  function isAdded(n){ return (S.added||[]).some(function(a){return a.n===n;}); }

  function isT100(c){ var o=S.t100[c.n]; return o===undefined?!!c.t100:!!o; }
  function rounds(name){ var r=S.ratings[name]; return (r&&r.rounds)||[]; }
  function isRated(name){ return rounds(name).length>0; }
  function allRounds(){ var out=[]; for(var n in S.ratings){ rounds(n).forEach(function(rd){out.push({course:n,rd:rd});}); }
    out.sort(function(a,b){return (a.rd.date<b.rd.date?1:a.rd.date>b.rd.date?-1:0);}); return out; }
  /* A round's rating is a weighted roll-up of every category it carries. Each one is read
     out of 10 first (Memorable Holes is out of 18, so 9 of them is a 5.0), then weighted:
     every category once, Totality twice, so a complete rating divides by 8. Anything the
     round doesn't carry drops out of both the total and the divisor, so a part-filled
     rating still scores on what it has. Rounds from the scoring system that predates all
     of this fall back to their old factor average. */
  function factorVal(rd,f){ return f.k==="tot"?(typeof rd.tot==="number"?rd.tot:null):catVal(rd,f.k); }
  function scoreOf(vals){ var s=0,w=0;
    SCORED.forEach(function(f){ var v=vals[f.k]; if(typeof v!=="number"||!isFinite(v))return; s+=v/f.max*10*f.w; w+=f.w; });
    return w?s/w:null; }

  /* ---------- THE ROUTE ITSELF ---------- */
  /* OSRM's public demo server turns the stops into an actual driving line with
     real miles and a real time behind the wheel. No key, no account. When it
     can't be reached we fall back to straight lines and say so, rather than
     quietly showing crow-flies miles as if they were driving miles. */
  var OSRM="https://router.project-osrm.org/route/v1/driving/";
  var routeCache={},routeWait={};
  function stopSig(st){ return st.map(function(s){return s.lng.toFixed(4)+","+s.lat.toFixed(4);}).join(";"); }
  function decodePoly(s){ var ll=[],i=0,lat=0,lng=0,b,sh,res;
    while(i<s.length){
      sh=0;res=0; do{ b=s.charCodeAt(i++)-63; res|=(b&31)<<sh; sh+=5; }while(b>=32);
      lat+=(res&1)?~(res>>1):(res>>1);

  function getRoute(st,cb){ if(st.length<2){cb(null);return;}
    var sig=stopSig(st);
    if(routeCache[sig]){cb(routeCache[sig]);return;}
    cb(straightRoute(st));
    if(routeWait[sig]){ routeWait[sig].push(cb); return; }
    routeWait[sig]=[cb];
    var url=OSRM+sig+"?overview=full&geometries=polyline&annotations=false";
    var done=false;

    fetch(url).then(function(r){return r.ok?r.json():null;}).then(function(d){

      settle(rt?{ll:decodePoly(rt.geometry),mi:rt.distance/1609.344,sec:rt.duration,
        legs:(rt.legs||[]).map(function(l){return l.distance/1609.344;}),driving:true}:null);
    }).catch(function(){ settle(null); }); }
  function driveTime(sec){ if(sec==null)return null; var h=Math.floor(sec/3600),m=Math.round(sec%3600/60);
    if(m===60){h++;m=0;} return h?h+"h"+(m?" "+m+"m":""):m+"m"; }

  /* ---------- COURSES ALONG THE WAY ---------- */
  /* miles from a point to a route segment, flat-earth over the few miles that matter */
  function segMi(p,a,b){ var kx=69.172*Math.cos(p[0]*Math.PI/180),ky=69.055;
    var px=p[1]*kx,py=p[0]*ky,ax=a[1]*kx,ay=a[0]*ky,dx=b[1]*kx-ax,dy=b[0]*ky-ay;

  /* Every course within maxMi of the line, from all three pools: the ones they've

  /* ---------- map ---------- */
  var map,markers={},dreamMarkers={},baseLayers={},curBase,playedLayer,dreamLayer,tripLayer;

  function initMap(){ map=L.map("map",{zoomControl:false,scrollWheelZoom:true}).setView([39.5,-98.5],4);

    ]);

    map.on("moveend zoomend",drawUsLayer); }
  /* 14,000 markers would sink a phone, so only what is on screen is drawn, only once
     you're zoomed in enough for it to mean anything, and never more than US_MAX_DOTS. */
  function drawUsLayer(){ if(!usLayer)return; usLayer.clearLayers();
    var note=document.getElementById("usNote");
    function say(t){ if(note){ note.textContent=t||""; note.style.display=t?"":"none"; } }
    if(!usOn){ say(""); return; }
    if(map.getZoom()<US_MIN_ZOOM){ say("Zoom in to see every course"); return; }
    var b=map.getBounds(),n=0,capped=false;
    for(var i=0;i<US_ROWS.length;i++){ var r=US_ROWS[i];
      if(!b.contains([r[2],r[3]]))continue;
      if(haveNear(r[0],US_STATES[r[1]]))continue;         // already a dot on Played
      if(n>=US_MAX_DOTS){ capped=true; break; }
      (function(row){ var m=L.circleMarker([row[2],row[3]],{radius:4,fillColor:"#8aa0b8",color:"#fff",weight:1.5,opacity:1,fillOpacity:.95});
        m.on("click",function(){ openUsCourse(usCourse(row)); }); usLayer.addLayer(m); })(r);

    say(n?(n+" course"+(n===1?"":"s")+" here"+(capped?" — zoom in for the rest":"")):"No other courses in view"); }
  function circleStyle(c){ var rated=isRated(c.n),sc=courseScore(c.n),t=isT100(c);

    return {radius:t?7:6,fillColor:fill,color:"#fff",weight:2,opacity:1,fillOpacity:(t||rated)?1:.85}; }

    dreamAll.forEach(function(d){ if(dreamPlayed(d))return; var m=L.circleMarker([d.lat,d.lng],dreamCircleStyle()); m.on("click",function(){openDreamCourse(d);}); dreamMarkers[d.n]=m; dreamLayer.addLayer(m); }); }

  function refreshMarker(c){ if(markers[c.n])markers[c.n].setStyle(circleStyle(c)); }
  function wireMapControls(){
    document.querySelectorAll("#basemaps button").forEach(function(b){ b.onclick=function(){
      document.querySelectorAll("#basemaps button").forEach(function(x){x.classList.remove("on");}); b.classList.add("on");
      map.removeLayer(curBase); curBase=baseLayers[b.dataset.b]; curBase.addTo(map); if(curBase.bringToBack)curBase.bringToBack(); }; });
    document.querySelectorAll("#mapLayers button").forEach(function(b){ b.onclick=function(){ b.classList.toggle("on");
      var k=b.dataset.l, on=b.classList.contains("on");
      if(k==="us"){ usOn=on; if(on)map.addLayer(usLayer); else map.removeLayer(usLayer); drawUsLayer(); return; }
      var grp=k==="played"?playedLayer:dreamLayer; if(on)map.addLayer(grp); else map.removeLayer(grp); }; });

      box.appendChild(wait); return box; }

      h("div",{class:"h2h-vs"},(wt!=null&&rt!=null&&fmt(wt)!==fmt(rt))?("Δ "+fmt(Math.abs(parseFloat(fmt(wt))-parseFloat(fmt(rt))))):"VS"),

  /* ---------- ROAD TRIPS ---------- */
  var activeTripId=S.activeTripId||null;
  function tripById(id){ return S.trips.filter(function(t){return t.id===id;})[0]; }
  function haversine(a,b){ var R=3958.8,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180,la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180;
    var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.sin(dLng/2)*Math.sin(dLng/2)*Math.cos(la1)*Math.cos(la2); return 2*R*Math.asin(Math.sqrt(x)); }
  function tripDistance(st){ var t=0; for(var i=1;i<st.length;i++)t+=haversine(st[i-1],st[i]); return t; }
  function optimize(st){ if(st.length<3)return st.slice(); var rem=st.slice(),route=[rem.shift()];
    while(rem.length){ var last=route[route.length-1],bi=0,bd=Infinity; rem.forEach(function(s,i){var d=haversine(last,s);if(d<bd){bd=d;bi=i;}}); route.push(rem.splice(bi,1)[0]); } return route; }
  /* A trip with a start and a finish in it has an order the driver chose; only a
     loose bag of courses gets reshuffled into the shortest chain. */
  function hasPlaces(t){ return (t.stops||[]).some(function(s){return s.place;}); }
  function routeOrder(t){ if(!t)return []; return (t.fixed||hasPlaces(t))?t.stops.slice():optimize(t.stops); }
  function setActiveTrip(id){ activeTripId=id; S.activeTripId=id; save(); drawTrip(); updateTripBar(); }
  function addToTrip(stop,quiet){ var t=activeTripId?tripById(activeTripId):null;
    if(!t){ t={id:uid(),name:"Road Trip",stops:[]}; S.trips.push(t); activeTripId=t.id; S.activeTripId=t.id; }
    if(t.stops.some(function(s){return s.n===stop.n;})){toast(stop.n+" is already in "+t.name);return;}
    var rec={n:stop.n,s:stop.s||"",lat:stop.lat,lng:stop.lng};
    if(stop.place)rec.place=true;
    t.stops.push(rec); save(); drawTrip(); updateTripBar();
    if(!quiet)toast("Added "+stop.n+" to "+t.name); }

  /* ---------- DRAWING THE TRIP ---------- */
  var candLayer,candShown=[],lastRouteSig="",lastFitSig="";
  function tripStats(t,cb){ var ord=routeOrder(t);
    if(ord.length<2){ cb({mi:0,sec:null,legs:[],ll:ord.map(function(s){return [s.lat,s.lng];}),driving:false},ord); return; }
    getRoute(ord,function(r){ cb(r,ord); }); }
  function drawTrip(){ if(!tripLayer)return;
    var t=activeTripId?tripById(activeTripId):null;
    if(!t||!t.stops.length){ tripLayer.clearLayers(); if(candLayer)candLayer.clearLayers(); candShown=[]; lastRouteSig=""; return; }
    tripStats(t,function(r,ord){
      tripLayer.clearLayers();
      if(r&&r.ll&&r.ll.length>1){
        tripLayer.addLayer(L.polyline(r.ll,{color:"#fff",weight:7,opacity:.75}));
        tripLayer.addLayer(L.polyline(r.ll,{color:"#0c6e3c",weight:3.5,opacity:.95,
          dashArray:r.driving?null:"3,9"}));
      }
      ord.forEach(function(s,i){ var m=L.marker([s.lat,s.lng],{icon:tripPin(i+1,s.place)});
        m.on("click",function(){openTripDetail(t.id);}); tripLayer.addLayer(m); });
      drawCandidates(t,r);
      frameTrip(t,r);
    }); }
  function frameTrip(t,r){ var sig=t.id+"|"+stopSig(t.stops)+"|"+((r&&r.driving)?"d":"s");
    if(sig===lastFitSig||!map)return;
    var size=map.getSize(); if(size.x<60||size.y<60)return;   // the map view isn't on screen yet
    var ll=(r&&r.ll&&r.ll.length>1)?r.ll:t.stops.map(function(s){return [s.lat,s.lng];});
    if(!ll.length)return;
    lastFitSig=sig;
    try{ map.fitBounds(L.latLngBounds(ll),{animate:false,maxZoom:12,
      paddingTopLeft:[26,96],paddingBottomRight:[26,150]}); }catch(e){} }
  /* the suggestions along the way, drawn once per route rather than per redraw */
  function drawCandidates(t,r){ if(!candLayer)return;
    var sig=(r&&r.ll?r.ll.length+"@"+stopSig(t.stops):"")+"|"+(t.det||15)+"|"+(t.showCand===false?"0":"1");
    if(sig===lastRouteSig)return; lastRouteSig=sig;
    candLayer.clearLayers(); candShown=[];
    if(t.showCand===false||!r||!r.ll||r.ll.length<2)return;
    var hits=alongRoute(r.ll,t.det||15,t.stops).sort(function(a,b){return b.w-a.w;}).slice(0,60);
    candShown=hits;
    hits.forEach(function(o,i){ var top=i<12;
      var m=L.circleMarker([o.c.lat,o.c.lng],{radius:top?7:5,color:"#fff",weight:2,
        fillColor:top?"#b8902f":"#8aa0b8",fillOpacity:top?.95:.8});
      m.on("click",function(){ openStopCard(o.c,o.det,t.id); });
      candLayer.addLayer(m); }); }
  function updateTripBar(){ var bar=document.getElementById("tripBar"),btn=document.getElementById("openTrip"); var t=activeTripId?tripById(activeTripId):null;
    if(!t||!t.stops.length){bar.style.display="none"; if(btn)btn.style.display="flex"; return;}
    bar.style.display="flex"; if(btn)btn.style.display="none";

      if(r&&r.mi)bits.push((r.driving?"":"~")+Math.round(r.mi)+" mi");
      var dt=r&&driveTime(r.sec); if(dt)bits.push(dt+" driving");

      sheet.appendChild(list);

  /* ---------- A PLACE, NOT A COURSE ---------- */
  /* Nominatim turns "Asheville, NC" into a point you can anchor a route to. Same
     OpenStreetMap data and licence as everything else on the map, no key. */
  var GEO="https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&countrycodes=us&q=";
  var geoCache={};
  function geoSearch(q,cb){ q=q.trim(); if(q.length<3){cb([]);return;}
    var k=q.toLowerCase(); if(geoCache[k]){cb(geoCache[k]);return;}
    fetch(GEO+encodeURIComponent(q)).then(function(r){return r.ok?r.json():[];}).then(function(d){
      var out=(d||[]).map(function(p){ var parts=(p.display_name||"").split(",").map(function(s){return s.trim();});
        return {n:parts[0]||q,s:parts.slice(1,-1).slice(-2).join(", ")||parts.slice(1).join(", "),
          full:p.display_name,lat:+p.lat,lng:+p.lon,place:true}; });
      geoCache[k]=out; cb(out);
    }).catch(function(){ cb(null); }); }
  function openPlacePicker(id){ var sheet=document.getElementById("sheet"); sheet.innerHTML="";
    sheet.appendChild(h("div",{class:"grab"})); sheet.appendChild(h("h2",{},"Add a place"));
    sheet.appendChild(h("div",{class:"loc"},"A town, an address, an airport — anywhere the drive starts, ends or turns"));
    var s=h("div",{class:"search",style:"margin:0 0 6px"},[h("span",{},"🔎")]);
    var inp=h("input",{placeholder:"Asheville, NC"}); s.appendChild(inp); sheet.appendChild(s);
    var lw=h("div",{class:"row-pick"}); sheet.appendChild(lw);
    var tT=null;
    function draw(res){ lw.innerHTML="";
      if(res===null){ lw.appendChild(h("div",{class:"empty"},"Couldn't reach the place lookup. Add a course as the start instead.")); return; }
      if(!res.length){ lw.appendChild(h("div",{class:"empty"},inp.value.trim().length<3?"Type a town or an address.":"Nothing found.")); return; }
      res.forEach(function(p){
        var row=h("div",{class:"row",style:"margin:0 0 9px"},[
          h("div",{class:"badge-sm",style:"background:var(--navy);font-size:18px"},"◆"),
          h("div",{class:"meta"},[h("div",{class:"nm"},p.n),h("div",{class:"sb"},p.s)]),
          h("div",{class:"chev"},"＋")]);
        row.onclick=function(){ addToTrip(p); openTripDetail(id); }; lw.appendChild(row); }); }
    inp.oninput=function(){ clearTimeout(tT); var q=inp.value;
      lw.innerHTML=""; lw.appendChild(h("div",{class:"empty"},"Looking…"));
      tT=setTimeout(function(){ geoSearch(q,draw); },450); };
    draw([]);
    var back=h("button",{class:"btn ghost"},"Done"); back.onclick=function(){openTripDetail(id);}; sheet.appendChild(back);
    showScrim(sheet); setTimeout(function(){inp.focus();},350); }

  function courseInsights(c){ var out=insightsFor(c,null);
    return out.filter(function(i){ return i.k!=="ours"; }); }
  function tripPicker(id){ var t=tripById(id); var sheet=document.getElementById("sheet"); sheet.innerHTML="";
    sheet.appendChild(h("div",{class:"grab"})); sheet.appendChild(h("h2",{},"Add a course")); sheet.appendChild(h("div",{class:"loc"},"Played courses, dream courses and your wishlist"));
    var s=h("div",{class:"search",style:"margin:0 0 6px"},[h("span",{},"🔎")]); var inp=h("input",{placeholder:"Search…"}); s.appendChild(inp); sheet.appendChild(s);
    var lw=h("div",{class:"row-pick"}); sheet.appendChild(lw);
    var cand=[]; var seen={};
    COURSES.forEach(function(c){ var k=normKey(c.n); if(!seen[k]){seen[k]=1;cand.push({n:c.n,s:c.s,lat:c.lat,lng:c.lng,kind:"played"});} });
    dreamAll.forEach(function(d){ var k=normKey(d.n); if(!seen[k]){seen[k]=1;cand.push({n:d.n,s:d.s,lat:d.lat,lng:d.lng,kind:"dream"});} });
    S.wishlist.forEach(function(w){ if(w.lat){var k=normKey(w.n); if(!seen[k]){seen[k]=1;cand.push({n:w.n,s:w.s,lat:w.lat,lng:w.lng,kind:"wish"});}} });
    function draw(){ var ql=inp.value.trim().toLowerCase(); lw.innerHTML="";
      var hits=cand.filter(function(c){return !ql||(c.n+" "+c.s).toLowerCase().indexOf(ql)>=0;}).slice(0,60);
      // past their own lists, the whole US dataset is fair game for a stop on a trip
      if(ql)usSearch(ql,60-hits.length).forEach(function(u){ hits.push({n:u.n,s:u.s,lat:u.lat,lng:u.lng,kind:"us"}); });
      hits.forEach(function(c){
        var inTrip=t.stops.some(function(s){return s.n===c.n;});
        var tagcol=c.kind==="dream"?"var(--gold)":c.kind==="wish"?"var(--gold-soft)":c.kind==="us"?"#8aa0b8":"var(--green)";
        var lead=h("div",{class:"badge-sm",style:"background:"+tagcol+";font-size:18px"},c.kind==="played"?"⛳":c.kind==="us"?"📍":"★");
        var row=h("div",{class:"row",style:"margin:0 0 9px"},[lead,h("div",{class:"meta"},[h("div",{class:"nm"},c.n),h("div",{class:"sb"},c.s+(c.kind==="us"?" · not in your list":""))]),h("div",{class:"chev"},inTrip?"✓":"＋")]);
        row.onclick=function(){ if(inTrip){toast("Already added");return;} addToTrip(c); draw(); }; lw.appendChild(row); });
      if(!lw.children.length)lw.appendChild(h("div",{class:"empty"},"No matches.")); }
    var back=h("button",{class:"btn ghost"},"Done");
    inp.oninput=draw; draw(); sheet.appendChild(back); back.onclick=function(){openTripDetail(id);};
    showScrim(sheet); setTimeout(function(){inp.focus();},350); }

  /* ---------- nav / filters ---------- */
  /* Drop the map on a course and turn the surrounding courses on, so a name from the
     search becomes a place. */
  function showOnMap(c,withUs){
    switchView("map");
    if(!map)return;
    setTimeout(function(){ map.invalidateSize(); map.setView([c.lat,c.lng],13);
      if(withUs){ var b=document.querySelector('#mapLayers button[data-l="us"]');
        if(b&&!b.classList.contains("on"))b.click(); else drawUsLayer(); }
      else drawUsLayer(); drawTrip(); },140);
    closeSheet(); }
  function switchView(v){ ["feed","map","rank","dream"].forEach(function(x){document.getElementById("view-"+x).classList.toggle("active",x===v);});
    document.querySelectorAll("nav button[data-v]").forEach(function(b){b.classList.toggle("on",b.dataset.v===v);});
    if(v==="map"&&map)setTimeout(function(){map.invalidateSize();drawTrip();},120); }
  document.querySelectorAll("nav button[data-v]").forEach(function(b){b.onclick=function(){switchView(b.dataset.v);};});
  document.getElementById("feed-all").onclick=function(e){e.preventDefault();switchView("rank");};
  document.querySelectorAll("#feed-filters .chip").forEach(function(ch){ ch.onclick=function(){ document.querySelectorAll("#feed-filters .chip").forEach(function(x){x.classList.remove("on");}); ch.classList.add("on"); feedFilter=ch.dataset.w; renderFeed(); }; });
  document.querySelectorAll("#rank-filters .chip").forEach(function(ch){ ch.onclick=function(){ document.querySelectorAll("#rank-filters .chip").forEach(function(x){x.classList.remove("on");}); ch.classList.add("on"); rankFilter=ch.dataset.f; renderRank(); }; });
  document.querySelectorAll("#dream-seg .chip").forEach(function(ch){ ch.onclick=function(){ document.querySelectorAll("#dream-seg .chip").forEach(function(x){x.classList.remove("on");}); ch.classList.add("on"); dreamSeg=ch.dataset.d; renderDream(); }; });
  // searching now scans 14,000 US courses as well as their own, so don't redraw on every keypress
  var qT=null;
  document.getElementById("q").oninput=function(e){ query=e.target.value.trim().toLowerCase();
    clearTimeout(qT); qT=setTimeout(renderRank,120); };

  /* ---------- start fresh (wipe ratings, keep the course list) ---------- */
  function resetRankings(){
    var n=Object.keys(S.ratings).length;
    if(!confirm("Start fresh? This wipes every rating, note, photo and ranking"+(n?" across "+n+" course"+(n>1?"s":""):"")+" — for both of you — and clears any “Should be Top 100” flags. The course list, Top-100 flags, trips and wishlist all stay."))return;
    var typed=prompt('Last check — this can\'t be undone. Type RESET to wipe it all.');
    if(typed==null||typed.trim().toUpperCase()!=="RESET"){toast("Nothing was wiped");return;}
    var ids=[]; for(var nm in S.ratings){ rounds(nm).forEach(function(r){(r.photos||[]).forEach(function(p){ids.push(p);});}); }
    ids.forEach(function(id){ delPhoto(id); delete photoCache[id]; });
    S.ratings={}; S.order=[]; S.snub={};
    save(); COURSES.forEach(refreshMarker); renderAll();
    toast("Fresh start — every course is back to unrated");
  }
  document.getElementById("wipeBtn").onclick=resetRankings;

  function boot(){ activeTripId=S.activeTripId||null;
    document.getElementById("openTrip").onclick=openTrips;
    document.getElementById("tb-manage").onclick=function(){ if(activeTripId)openTripDetail(activeTripId); };
    try{ initMap(); }catch(e){} // map is optional — keep the rest of the app alive if Leaflet/tiles can't load
    renderAll(); drawTrip(); updateTripBar(); pollUpdates(); }
  loadState().then(boot).catch(function(){ boot(); });
})();
</script>
</body>
</html>
