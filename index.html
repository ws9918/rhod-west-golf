    var payField=h("div",{class:"field"}); payField.appendChild(h("label",{},"What would you pay?"));
    var pay=h("input",{class:"txt",type:"number",inputmode:"decimal",min:"0",placeholder:"What it's worth to you, in $"});
    if(editing&&typeof editRd.pay==="number")pay.value=editRd.pay;
    payField.appendChild(pay); payField.appendChild(h("div",{class:"hint"},"Not what they charge — what you'd pay.")); sheet.appendChild(payField);

    var nField=h("div",{class:"field"}); nField.appendChild(h("label",{},"The story")); var notes=h("textarea",{placeholder:"Best shot, the choke, conditions, signature hole…"}); if(editing&&editRd.notes)notes.value=editRd.notes; nField.appendChild(notes); sheet.appendChild(nField);

    var go=h("button",{class:"btn primary"},editing?"Save changes":"Save rating");
    var saveWrap=h("div",{class:"savebar"},go);
    go.onclick=function(){ if(!by){toast("Pick whose rating this is");sheet.scrollTop=0;return;}
      if(chosen.indexOf(by)<0)chosen.unshift(by);
      var rec=editing?editRd:{id:uid(),date:new Date().toISOString().slice(0,10),photos:[]};
      rec.photos=rec.photos||[]; rec.by=by; rec.players=chosen.slice(); rec.notes=notes.value.trim();
      CATS.forEach(function(f){rec[f.k]=vals[f.k];}); rec.tot=vals.tot;
      if(reco)rec.reco=reco; else delete rec.reco;
      var pv=parseFloat(pay.value); if(pay.value!==""&&isFinite(pv))rec.pay=Math.max(0,pv); else delete rec.pay;
      if(!ME&&!forWho&&!editing)setMe(by); // first-time setup only — adding or adjusting the other person's rating never flips the phone's identity
      Promise.all(pendingPhotos.map(function(p){rec.photos.push(p.id);return putPhoto(p.id,p.data);})).then(function(){
        return withFresh(function(){
          if(!S.ratings[c.n])S.ratings[c.n]={rounds:[]}; var arr=S.ratings[c.n].rounds;
          var t=editing?roundById(c.n,rec.id):null;
          if(t&&t!==rec){ for(var k in t)if(!(k in rec))delete t[k]; for(var k2 in rec)t[k2]=rec[k2]; }
          else if(!t)arr.push(rec);
        }); }).then(function(){ afterLog(c,editing); });
    };
    sheet.appendChild(saveWrap); syncBy(); syncWho(); syncReco(); showScrim(sheet);
  }
  function stageFiles(gal,addBtn){ var inp=document.getElementById("fileIn"); inp.value="";
    inp.onchange=function(){ Array.prototype.slice.call(inp.files).forEach(function(f){ downscale(f).then(function(data){ if(!data)return; var id=uid();
      pendingPhotos.push({id:id,data:data}); photoCache[id]=data; var im=h("img",{alt:"",src:data}); im.onclick=function(){var i=pendingPhotos.findIndex(function(x){return x.id===id;});if(i>=0)pendingPhotos.splice(i,1);gal.removeChild(im);}; gal.insertBefore(im,addBtn); }); }); };
    inp.click(); }
  // after saving, land on the course view: side-by-side (or "waiting on…"), with adjust/delete on each rating
  function afterLog(c,edited){ refreshMarker(c); renderAll(); closeSheet(); toast((edited?"Rating updated · ":"Rating saved · ")+c.n); setTimeout(function(){openCourse(c);},260); }

  /* ---------- RECAP ---------- */
  function openRecap(c,rd){ var sheet=document.getElementById("sheet"); sheet.innerHTML="";
    sheet.appendChild(h("div",{class:"grab"})); sheet.appendChild(h("h2",{},raterLabel(rd))); sheet.appendChild(h("div",{class:"loc"},(c.s||"")));
    var wrap=h("div",{id:"recapWrap"}); var card=h("div",{class:"recap",id:"recapCard"}); var rsc=roundScore(rd);
    if(rd.photos&&rd.photos.length){ var im=h("img",{class:"rphoto",alt:"",crossorigin:"anonymous"}); loadPhoto(rd.photos[0],im); card.appendChild(im); }
    else card.appendChild(h("div",{class:"rphoto rph-empty",style:"display:grid;place-items:center;font-size:46px"},"⛳"));
    card.appendChild(h("div",{class:"rgrad"}));
    card.appendChild(h("div",{class:"rkick"},"RHOD + WEST · GOLF ADVENTURES"));
    card.appendChild(h("div",{class:"rscore",style:"background:"+scoreColor(rsc)},fmt(rsc)));
    card.appendChild(h("div",{class:"ravs"},avatarsFor(rd.players,true)));
    var body=h("div",{class:"rbody"});
    body.appendChild(h("h3",{},c.n+(isT100(c)?"  ★":"")));
    body.appendChild(h("div",{class:"rsub"},(c.s||"Rhod + West Golf Adventures")));
    var bars=h("div",{class:"rbars"}); SCORED.forEach(function(f){ var v=factorVal(rd,f); if(v==null)return;
      var rn=h("div",{class:"rn"},f.t); if(f.w>1)rn.appendChild(h("span",{class:"wx"},"×"+f.w));
      bars.appendChild(h("div",{class:"rbar"},[rn,h("div",{class:"rt"},h("i",{style:"width:"+(v/f.max*100)+"%"})),h("div",{class:"rv"},f.count?Math.round(v)+"/"+f.max:fmt(v))])); }); body.appendChild(bars);
    var tags=h("div",{class:"rtags"});
    tags.appendChild(h("span",{class:"rtag"},[h("em",{},"Rated by"),raterOf(rd)]));
    tags.appendChild(h("span",{class:"rtag"},[h("em",{},"Played"),(rd.players||[]).join(" & ")]));
    if(typeof rd.pay==="number")tags.appendChild(h("span",{class:"rtag"},[h("em",{},"Would pay"),payLabel(rd.pay)]));
    var rl=recoLabel(rd.reco); if(rl)tags.appendChild(h("span",{class:"rtag win"},rl));
    body.appendChild(tags);
    if(rd.notes)body.appendChild(h("div",{style:"font-size:13px;opacity:.85;margin-top:14px;line-height:1.5"},rd.notes));
    card.appendChild(body); wrap.appendChild(card); sheet.appendChild(wrap);
    var ed=h("button",{class:"btn primary"},"Adjust this rating"); ed.onclick=function(){ openLog(c,rd); }; sheet.appendChild(ed);
    var share=h("button",{class:"btn dark"},"Save / share recap image"); share.onclick=function(){shareRecap(card,c);}; sheet.appendChild(share);
    var addP=h("button",{class:"btn ghost"},"Add more photos"); addP.onclick=function(){addPhotosTo(c,rd);}; sheet.appendChild(addP);
    var del=h("button",{class:"btn ghost",style:"color:var(--bad)"},"Delete this rating");
    del.onclick=function(){ deleteRound(c,rd,function(){ if(isRated(c.n))openCourse(c); else closeSheet(); }); };
    sheet.appendChild(del);
    showScrim(sheet); }
  function addPhotosTo(c,rd){ var inp=document.getElementById("fileIn"); inp.value="";
    inp.onchange=function(){ Promise.all(Array.prototype.slice.call(inp.files).map(function(f){return downscale(f).then(function(data){if(!data)return null;var id=uid();photoCache[id]=data;return putPhoto(id,data).then(function(){return id;});});}))
      .then(function(ids){ ids=ids.filter(Boolean); withFresh(function(){ var t=roundById(c.n,rd.id)||rd; t.photos=t.photos||[]; ids.forEach(function(id){t.photos.push(id);}); if(t!==rd)rd.photos=t.photos; })
        .then(function(){ renderAll(); toast("Photos added"); openRecap(c,roundById(c.n,rd.id)||rd); }); }); };
    inp.click(); }
  function shareRecap(card,c){ if(typeof html2canvas!=="function"){toast("Screenshot this card to share");return;} toast("Rendering image…");
    html2canvas(card,{backgroundColor:null,scale:2,useCORS:true}).then(function(canvas){ canvas.toBlob(function(blob){ if(!blob){toast("Couldn't render. Try a screenshot.");return;}
      var file=new File([blob],(c.n.replace(/[^a-z0-9]+/gi,"-")+"-recap.png"),{type:"image/png"});
      if(navigator.canShare&&navigator.canShare({files:[file]}))navigator.share({files:[file],title:c.n,text:"Rating · "+c.n}).catch(function(){});
      else{var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=file.name;a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},4000);toast("Saved recap image");} },"image/png");
    }).catch(function(){toast("Couldn't render. Try a screenshot of the card.");}); }


  /* ---------- picker ---------- */
  function openPicker(){ var sheet=document.getElementById("sheet"); sheet.innerHTML="";
    sheet.appendChild(h("div",{class:"grab"})); sheet.appendChild(h("h2",{},"Rate a course")); sheet.appendChild(h("div",{class:"loc"},"Pick the course"));
    var s=h("div",{class:"search",style:"margin:0 0 6px"},[h("span",{},"🔎")]); var inp=h("input",{placeholder:"Search courses…"}); s.appendChild(inp); sheet.appendChild(s);
    var lw=h("div",{class:"row-pick"}); sheet.appendChild(lw);
    function draw(){ var ql=inp.value.trim().toLowerCase(); lw.innerHTML="";
      COURSES.filter(function(c){return !ql||(c.n+" "+c.s).toLowerCase().indexOf(ql)>=0;}).slice(0,80).forEach(function(c){ var sc=courseScore(c.n);
        var lead=isRated(c.n)?h("div",{class:"badge-sm",style:"background:"+scoreColor(sc)},fmt(sc)):h("div",{class:"badge-sm un"},"＋");
        var nm=h("div",{class:"nm"},c.n); if(isT100(c))nm.appendChild(h("span",{class:"star"},"★"));
        var row=h("div",{class:"row",style:"margin:0 0 9px"},[lead,h("div",{class:"meta"},[nm,h("div",{class:"sb"},c.s)]),h("div",{class:"chev"},"›")]);
        row.onclick=function(){closeSheet();setTimeout(function(){openLog(c);},200);}; lw.appendChild(row); });
      if(!lw.children.length)lw.appendChild(h("div",{class:"empty"},"No matches.")); }
    inp.oninput=draw; draw(); showScrim(sheet); setTimeout(function(){inp.focus();},350); }
  document.getElementById("navAdd").onclick=openPicker;

  /* ---------- ROAD TRIPS ---------- */
  var activeTripId=S.activeTripId||null;
  function tripById(id){ return S.trips.filter(function(t){return t.id===id;})[0]; }
  function haversine(a,b){ var R=3958.8,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180,la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180;
    var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.sin(dLng/2)*Math.sin(dLng/2)*Math.cos(la1)*Math.cos(la2); return 2*R*Math.asin(Math.sqrt(x)); }
  function tripDistance(st){ var t=0; for(var i=1;i<st.length;i++)t+=haversine(st[i-1],st[i]); return t; }
  function optimize(st){ if(st.length<3)return st.slice(); var rem=st.slice(),route=[rem.shift()];
    while(rem.length){ var last=route[route.length-1],bi=0,bd=Infinity; rem.forEach(function(s,i){var d=haversine(last,s);if(d<bd){bd=d;bi=i;}}); route.push(rem.splice(bi,1)[0]); } return route; }
  function setActiveTrip(id){ activeTripId=id; S.activeTripId=id; save(); drawTrip(); updateTripBar(); }
  function addToTrip(stop){ var t=activeTripId?tripById(activeTripId):null;
    if(!t){ t={id:uid(),name:"Road Trip",stops:[]}; S.trips.push(t); activeTripId=t.id; S.activeTripId=t.id; }
    if(t.stops.some(function(s){return s.n===stop.n;})){toast(stop.n+" is already in "+t.name);return;}
    t.stops.push({n:stop.n,s:stop.s||"",lat:stop.lat,lng:stop.lng}); save(); drawTrip(); updateTripBar(); toast("Added "+stop.n+" to "+t.name); }
  function drawTrip(){ if(!tripLayer)return; tripLayer.clearLayers(); var t=activeTripId?tripById(activeTripId):null; if(!t||!t.stops.length)return;
    var ord=optimize(t.stops),ll=[]; ord.forEach(function(s,i){ ll.push([s.lat,s.lng]); var m=L.marker([s.lat,s.lng],{icon:tripPin(i+1)}); m.on("click",function(){openTripDetail(t.id);}); tripLayer.addLayer(m); });
    if(ll.length>1)tripLayer.addLayer(L.polyline(ll,{color:"#0c6e3c",weight:3,opacity:.85,dashArray:"3,9"})); }
  function updateTripBar(){ var bar=document.getElementById("tripBar"),btn=document.getElementById("openTrip"); var t=activeTripId?tripById(activeTripId):null;
    if(!t||!t.stops.length){bar.style.display="none"; if(btn)btn.style.display="flex"; return;}
    bar.style.display="flex"; if(btn)btn.style.display="none";
    document.getElementById("tb-name").textContent=t.name;
    document.getElementById("tb-meta").textContent=t.stops.length+" stops · ~"+Math.round(tripDistance(optimize(t.stops)))+" mi · "+(function(d){return d+(d===1?" day":" days");})(Math.max(1,Math.ceil(t.stops.length/2))); }
  function openTrips(){ var sheet=document.getElementById("sheet"); sheet.innerHTML="";
    sheet.appendChild(h("div",{class:"grab"})); sheet.appendChild(h("h2",{},"Road trips")); sheet.appendChild(h("div",{class:"loc"},"Plan your next golf adventure"));
    if(!S.trips.length)sheet.appendChild(h("div",{class:"empty",style:"padding:10px 0 16px"},[h("div",{class:"em"},"🗺️"),h("div",{},"No trips yet. Start one, then add courses from the map, dream lists, or search.")]));
    S.trips.forEach(function(t){ var d=tripDistance(optimize(t.stops));
      var row=h("div",{class:"trip-row"},[ h("div",{class:"meta"},[h("div",{class:"nm"},t.name),h("div",{class:"sb"},t.stops.length+" stops · ~"+Math.round(d)+" mi"+(t.id===activeTripId?" · active":""))]), h("div",{class:"chev"},"›") ]);
      row.onclick=function(){ setActiveTrip(t.id); openTripDetail(t.id); }; sheet.appendChild(row); });
    var nw=h("button",{class:"btn primary"},"＋ New trip"); nw.onclick=function(){ var nm=prompt("Trip name","Road Trip"); if(nm===null)return; var t={id:uid(),name:nm.trim()||"Road Trip",stops:[]}; S.trips.push(t); setActiveTrip(t.id); openTripDetail(t.id); }; sheet.appendChild(nw);
    showScrim(sheet); }
  function openTripDetail(id){ var t=tripById(id); if(!t){openTrips();return;} setActiveTrip(id);
    var sheet=document.getElementById("sheet"); sheet.innerHTML="";
    sheet.appendChild(h("div",{class:"grab"}));
    sheet.appendChild(h("h2",{},t.name));
    var ord=optimize(t.stops);
    sheet.appendChild(h("div",{class:"loc"},[h("span",{class:"pill green"},t.stops.length+" STOPS"),h("span",{class:"pill"},"~"+Math.round(tripDistance(ord))+" MI"),h("span",{class:"pill"},(function(d){return d+(d===1?" DAY":" DAYS");})(Math.max(1,Math.ceil(t.stops.length/2))))]));
    if(!t.stops.length)sheet.appendChild(h("div",{class:"empty",style:"padding:8px 0 12px"},"No stops yet. Add courses below."));
    ord.forEach(function(s,i){ var leg=i>0?"~"+Math.round(haversine(ord[i-1],s))+" mi from "+ord[i-1].n:"Start";
      var st=h("div",{class:"tstop"},[ h("div",{class:"tn"},""+(i+1)), h("div",{class:"meta"},[h("div",{class:"nm",style:"font-family:Fraunces,serif;font-weight:600;font-size:15px"},s.n),h("div",{class:"leg"},leg)]) ]);
      var x=h("button",{class:"x"},"✕"); x.onclick=function(){ t.stops=t.stops.filter(function(q){return q.n!==s.n;}); save(); drawTrip(); updateTripBar(); openTripDetail(id); }; st.appendChild(x);
      sheet.appendChild(st); });
    // nearby gems
    var gems=nearbyGems(t); if(gems.length){ sheet.appendChild(h("div",{class:"section-h",style:"margin:16px 0 8px"},"Nearby bucket-list gems"));
      gems.forEach(function(g){ var row=h("div",{class:"gem"},[ h("div",{class:"meta"},[h("div",{class:"nm"},g.d.n),h("div",{class:"sb"},g.d.s+" · ~"+Math.round(g.dist)+" mi away")]) ]);
        var ad=h("button",{},"Add"); ad.onclick=function(){ addToTrip({n:g.d.n,s:g.d.s,lat:g.d.lat,lng:g.d.lng}); openTripDetail(id); }; row.appendChild(ad); sheet.appendChild(row); }); }
    var addc=h("button",{class:"btn primary"},"＋ Add a course"); addc.onclick=function(){ tripPicker(id); }; sheet.appendChild(addc);
    var rn=h("button",{class:"btn ghost"},"Rename trip"); rn.onclick=function(){ var nm=prompt("Trip name",t.name); if(nm!==null){t.name=nm.trim()||t.name;save();updateTripBar();openTripDetail(id);} }; sheet.appendChild(rn);
    var del=h("button",{class:"btn ghost"},"Delete trip"); del.onclick=function(){ if(confirm("Delete "+t.name+"?")){ S.trips=S.trips.filter(function(q){return q.id!==id;}); if(activeTripId===id){activeTripId=null;S.activeTripId=null;} save(); drawTrip(); updateTripBar(); closeSheet(); } }; sheet.appendChild(del);
    showScrim(sheet); }
  function nearbyGems(t){ if(!t.stops.length)return []; var out=[];
    dreamAll.forEach(function(d){ if(dreamPlayed(d))return; if(t.stops.some(function(s){return s.n===d.n;}))return;
      var md=Infinity; t.stops.forEach(function(s){ var dd=haversine(s,d); if(dd<md)md=dd; }); if(md<=80)out.push({d:d,dist:md}); });
    out.sort(function(a,b){return a.dist-b.dist;}); return out.slice(0,10); }
  function tripPicker(id){ var t=tripById(id); var sheet=document.getElementById("sheet"); sheet.innerHTML="";
    sheet.appendChild(h("div",{class:"grab"})); sheet.appendChild(h("h2",{},"Add a course")); sheet.appendChild(h("div",{class:"loc"},"Played courses, dream courses and your wishlist"));
    var s=h("div",{class:"search",style:"margin:0 0 6px"},[h("span",{},"🔎")]); var inp=h("input",{placeholder:"Search…"}); s.appendChild(inp); sheet.appendChild(s);
    var lw=h("div",{class:"row-pick"}); sheet.appendChild(lw);
    var cand=[]; var seen={};
    COURSES.forEach(function(c){ var k=normKey(c.n); if(!seen[k]){seen[k]=1;cand.push({n:c.n,s:c.s,lat:c.lat,lng:c.lng,kind:"played"});} });
    dreamAll.forEach(function(d){ var k=normKey(d.n); if(!seen[k]){seen[k]=1;cand.push({n:d.n,s:d.s,lat:d.lat,lng:d.lng,kind:"dream"});} });
    S.wishlist.forEach(function(w){ if(w.lat){var k=normKey(w.n); if(!seen[k]){seen[k]=1;cand.push({n:w.n,s:w.s,lat:w.lat,lng:w.lng,kind:"wish"});}} });
    function draw(){ var ql=inp.value.trim().toLowerCase(); lw.innerHTML="";
      var hits=cand.filter(function(c){return !ql||(c.n+" "+c.s).toLowerCase().indexOf(ql)>=0;}).slice(0,60);
      // past their own lists, the whole US dataset is fair game for a stop on a trip
      if(ql)usSearch(ql,60-hits.length).forEach(function(u){ hits.push({n:u.n,s:u.s,lat:u.lat,lng:u.lng,kind:"us"}); });
      hits.forEach(function(c){
        var inTrip=t.stops.some(function(s){return s.n===c.n;});
        var tagcol=c.kind==="dream"?"var(--gold)":c.kind==="wish"?"var(--gold-soft)":c.kind==="us"?"#8aa0b8":"var(--green)";
        var lead=h("div",{class:"badge-sm",style:"background:"+tagcol+";font-size:18px"},c.kind==="played"?"⛳":c.kind==="us"?"📍":"★");
        var row=h("div",{class:"row",style:"margin:0 0 9px"},[lead,h("div",{class:"meta"},[h("div",{class:"nm"},c.n),h("div",{class:"sb"},c.s+(c.kind==="us"?" · not in your list":""))]),h("div",{class:"chev"},inTrip?"✓":"＋")]);
        row.onclick=function(){ if(inTrip){toast("Already added");return;} addToTrip(c); draw(); }; lw.appendChild(row); });
      if(!lw.children.length)lw.appendChild(h("div",{class:"empty"},"No matches.")); }
    var back=h("button",{class:"btn ghost"},"Done");
    inp.oninput=draw; draw(); sheet.appendChild(back); back.onclick=function(){openTripDetail(id);};
    showScrim(sheet); setTimeout(function(){inp.focus();},350); }

  /* ---------- nav / filters ---------- */
  /* Drop the map on a course and turn the surrounding courses on, so a name from the
     search becomes a place. */
  function showOnMap(c,withUs){
    switchView("map");
    if(!map)return;
    setTimeout(function(){ map.invalidateSize(); map.setView([c.lat,c.lng],13);
      if(withUs){ var b=document.querySelector('#mapLayers button[data-l="us"]');
        if(b&&!b.classList.contains("on"))b.click(); else drawUsLayer(); }
      else drawUsLayer(); drawTrip(); },140);
    closeSheet(); }
  function switchView(v){ ["feed","map","rank","dream"].forEach(function(x){document.getElementById("view-"+x).classList.toggle("active",x===v);});
    document.querySelectorAll("nav button[data-v]").forEach(function(b){b.classList.toggle("on",b.dataset.v===v);});
    if(v==="map"&&map)setTimeout(function(){map.invalidateSize();drawTrip();},120); }
  document.querySelectorAll("nav button[data-v]").forEach(function(b){b.onclick=function(){switchView(b.dataset.v);};});
  document.getElementById("feed-all").onclick=function(e){e.preventDefault();switchView("rank");};
  document.querySelectorAll("#feed-filters .chip").forEach(function(ch){ ch.onclick=function(){ document.querySelectorAll("#feed-filters .chip").forEach(function(x){x.classList.remove("on");}); ch.classList.add("on"); feedFilter=ch.dataset.w; renderFeed(); }; });
  document.querySelectorAll("#rank-filters .chip").forEach(function(ch){ ch.onclick=function(){ document.querySelectorAll("#rank-filters .chip").forEach(function(x){x.classList.remove("on");}); ch.classList.add("on"); rankFilter=ch.dataset.f; renderRank(); }; });
  document.querySelectorAll("#dream-seg .chip").forEach(function(ch){ ch.onclick=function(){ document.querySelectorAll("#dream-seg .chip").forEach(function(x){x.classList.remove("on");}); ch.classList.add("on"); dreamSeg=ch.dataset.d; renderDream(); }; });
  // searching now scans 14,000 US courses as well as their own, so don't redraw on every keypress
  var qT=null;
  document.getElementById("q").oninput=function(e){ query=e.target.value.trim().toLowerCase();
    clearTimeout(qT); qT=setTimeout(renderRank,120); };

  /* ---------- start fresh (wipe ratings, keep the course list) ---------- */
  function resetRankings(){
    var n=Object.keys(S.ratings).length;
    if(!confirm("Start fresh? This wipes every rating, note, photo and ranking"+(n?" across "+n+" course"+(n>1?"s":""):"")+" — for both of you — and clears any “Should be Top 100” flags. The course list, Top-100 flags, trips and wishlist all stay."))return;
    var typed=prompt('Last check — this can\'t be undone. Type RESET to wipe it all.');
    if(typed==null||typed.trim().toUpperCase()!=="RESET"){toast("Nothing was wiped");return;}
    var ids=[]; for(var nm in S.ratings){ rounds(nm).forEach(function(r){(r.photos||[]).forEach(function(p){ids.push(p);});}); }
    ids.forEach(function(id){ delPhoto(id); delete photoCache[id]; });
    S.ratings={}; S.order=[]; S.snub={};
    save(); COURSES.forEach(refreshMarker); renderAll();
    toast("Fresh start — every course is back to unrated");
  }
  document.getElementById("wipeBtn").onclick=resetRankings;

  function boot(){ activeTripId=S.activeTripId||null;
    document.getElementById("openTrip").onclick=openTrips;
    document.getElementById("tb-manage").onclick=function(){ if(activeTripId)openTripDetail(activeTripId); };
    try{ initMap(); }catch(e){} // map is optional — keep the rest of the app alive if Leaflet/tiles can't load
    renderAll(); drawTrip(); updateTripBar(); pollUpdates(); }
  loadState().then(boot).catch(function(){ boot(); });
})();
